name: "🔒 Update flake.lock"

# Weekly: `nix flake update`, run the flake checks and commit flake.lock
# straight to the default branch. If the checks failed, the commit says so and
# an issue is opened.
#
# Needs: no branch protection blocking pushes from github-actions on the
# default branch.

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake.lock
        id: update
        run: |
          nix flake update 2> update.log
          cat update.log
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.update.outputs.changed == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Enable KVM (for the VM tests)
        if: steps.update.outputs.changed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Flake checks
        id: check
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: nix flake check -L

      - name: Commit flake.lock to the default branch
        if: steps.update.outputs.changed == 'true'
        env:
          CHECK: ${{ steps.check.outcome }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "eacnix pins bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if [ "$CHECK" != "success" ]; then
            printf '\n**`nix flake check` failed** when this lock was updated, see the workflow run.\n' >> update.log
          fi
          git commit -m "flake.lock: update inputs" -m "$(cat update.log)"
          git pull --rebase origin "$BASE"
          git push origin "HEAD:$BASE"

      - name: Open an issue when the checks failed
        if: steps.update.outputs.changed == 'true' && steps.check.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create bump --color FBCA04 --description "Vendor kernel bump needed" 2>/dev/null || true
          gh issue create --label bump \
            --title "Checks failed after flake.lock update" \
            --body "flake.lock was committed to the default branch, but \`nix flake check\` failed: $run_url. Fix or revert the commit."
