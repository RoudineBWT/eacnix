name: "⬆️ Bump Fedora pins"

# Weekly: look for a newer Fedora kernel/grub/shim (of the release pinned in
# pkgs/fedora/sources.nix, stable repos only), rewrite the pins, refresh the
# vendored kernel config, run the flake checks and commit the bump straight to
# the default branch. If the checks failed, the commit says so and an issue is
# opened.
#
# Needs: no branch protection blocking pushes from github-actions on the
# default branch.

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      allow_unstable:
        description: "Accept builds that are not in Fedora's stable repositories yet"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: bump-fedora
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for newer Fedora builds
        id: bump
        run: python3 scripts/bump_fedora.py ${{ inputs.allow_unstable && '--allow-unstable' || '' }}

      - name: Free disk space
        if: steps.bump.outputs.changed == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install Nix
        if: steps.bump.outputs.changed == 'true'
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Refresh the vendored kernel config
        if: steps.bump.outputs.changed == 'true'
        run: |
          nix build -L .#fedora-kernel.vendored -o vendored
          cp -L --no-preserve=mode vendored/* pkgs/fedora/
          rm vendored

      - name: Enable KVM (for the VM tests)
        if: steps.bump.outputs.changed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Flake checks
        id: check
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: nix flake check -L

      - name: Commit the bump to the default branch
        if: steps.bump.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.bump.outputs.title }}
          CHECK: ${{ steps.check.outcome }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "eacnix pins bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pkgs/fedora
          if [ "$CHECK" != "success" ]; then
            printf '\n**`nix flake check` failed** when this bump was made, see the workflow run.\n' >> bump-summary.md
          fi
          git commit -m "$TITLE" -m "$(cat bump-summary.md)"
          git pull --rebase origin "$BASE"
          git push origin "HEAD:$BASE"

      - name: Open an issue when the checks failed
        if: steps.bump.outputs.changed == 'true' && steps.check.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.bump.outputs.title }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create bump --color FBCA04 --description "Vendor kernel bump needed" 2>/dev/null || true
          gh issue create --label bump \
            --title "Checks failed after bump: $TITLE" \
            --body "The bump was committed to the default branch, but \`nix flake check\` failed: $run_url. Fix or revert the commit."
